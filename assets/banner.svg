<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Pill Glow Background -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="topPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <style>
    /* Continuous dynamic motion compatible with GitHub Camo and SVG standards */
    @keyframes pulseGlow1 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes pulseGlow2 {
      0%, 100% { transform: scale(1.1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(0.9) translate(-25px, 20px); opacity: 0.55; }
    }
    @keyframes streamDash {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes streamDashReverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 240; }
    }
    @keyframes floatPillA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatPillB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; r: 3.5; }
      50% { opacity: 1; r: 5; }
    }

    .glow-orb1 {
      animation: pulseGlow1 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .glow-orb2 {
      animation: pulseGlow2 10s ease-in-out infinite;
      transform-origin: 1000px 240px;
    }
    .stream-line-1 {
      stroke-dasharray: 12 16;
      animation: streamDash 3.5s linear infinite;
    }
    .stream-line-2 {
      stroke-dasharray: 10 14;
      animation: streamDashReverse 4.5s linear infinite;
    }
    .pill-motion-1 {
      animation: floatPillA 5s ease-in-out infinite;
    }
    .pill-motion-2 {
      animation: floatPillB 6s ease-in-out infinite 0.5s;
    }
    .pill-motion-3 {
      animation: floatPillA 5.5s ease-in-out infinite 1s;
    }
    .status-dot {
      animation: pulseDot 2s ease-in-out infinite;
    }
  </style>

  <!-- Solid Canvas Background -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)" />

  <!-- Ambient Dynamic Glowing Circles (Background Layer) -->
  <g opacity="0.5">
    <circle class="glow-orb1" cx="220" cy="110" r="150" fill="#0284c7" />
    <circle class="glow-orb2" cx="980" cy="240" r="170" fill="#7c3aed" />
    <circle cx="600" cy="30" r="100" fill="#0ea5e9" opacity="0.18" />
  </g>

  <!-- Subtle Architecture Grid -->
  <g stroke="#334155" stroke-opacity="0.22" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Data Streams (Underneath Foreground) -->
  <path class="stream-line-1" d="M 60,180 C 260,105 390,265 600,180 C 810,95 950,245 1140,180" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" />
  <path class="stream-line-2" d="M 60,215 C 290,285 430,115 600,215 C 770,315 910,115 1140,215" fill="none" stroke="url(#streamGrad2)" stroke-width="1.8" />

  <!-- Node Connection Accent Rings (Background) -->
  <circle cx="260" cy="105" r="5" fill="#38bdf8" opacity="0.6" />
  <circle cx="950" cy="245" r="5" fill="#a855f7" opacity="0.6" />

  <!-- Top Pill / Status Tag -->
  <g class="pill-motion-1">
    <rect x="495" y="42" width="210" height="30" rx="15" fill="url(#topPillGrad)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" />
    <circle class="status-dot" cx="513" cy="57" r="4" fill="#38bdf8" />
    <text x="526" y="62" fill="#e0f2fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">ENTERPRISE ARCHITECTURE</text>
  </g>

  <!-- FOREGROUND: High-Contrast Crisp Typography -->
  <!-- Category Supertitle -->
  <text x="600" y="128" text-anchor="middle" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="700" letter-spacing="3.5">
    SECURE • GOVERNED • FEDERATED • ZERO-COPY
  </text>

  <!-- Main Banner Title -->
  <text x="600" y="178" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Enterprise Private Data Exchange
  </text>

  <!-- Subtitle -->
  <text x="600" y="214" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" letter-spacing="0.2">
    Curated SaaS Platforms, Commercial Data Clean Rooms &amp; Open-Source Data Spaces
  </text>

  <!-- Dynamic Bottom Highlight Cards -->
  <g transform="translate(140, 266)">
    <!-- Card 1: Commercial SaaS -->
    <g class="pill-motion-1">
      <rect x="0" y="0" width="280" height="44" rx="9" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="22" r="5" fill="#38bdf8" />
      <text x="38" y="27" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="600">Commercial SaaS Platforms</text>
      <text x="206" y="26" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="500">AWS • SNOW</text>
    </g>

    <!-- Card 2: Open Standards -->
    <g class="pill-motion-2">
      <rect x="320" y="0" width="280" height="44" rx="9" fill="url(#pillGrad)" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1.2" />
      <circle cx="344" cy="22" r="5" fill="#818cf8" />
      <text x="358" y="27" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="600">Open Data Spaces</text>
      <text x="472" y="26" fill="#818cf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="500">Delta Sharing • EDC</text>
    </g>

    <!-- Card 3: Sovereign Data Spaces -->
    <g class="pill-motion-3">
      <rect x="640" y="0" width="280" height="44" rx="9" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="664" cy="22" r="5" fill="#34d399" />
      <text x="678" y="27" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="600">Sovereign &amp; Zero-Trust</text>
      <text x="828" y="26" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="500">X-Road • Gaia-X</text>
    </g>
  </g>
</svg>
