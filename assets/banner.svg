<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="flowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Subtle background grid & pulse animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(0.95) translate(-25px, 20px); opacity: 0.55; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 250px; }
    .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 6s ease-in-out infinite 0.5s; }
    .pill-3 { animation: floatPill1 5.5s ease-in-out infinite 1s; }
    .stream-line {
      stroke-dasharray: 12 18;
      animation: dataStream 4s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Animated Ambient Glow Spheres (Layered safely in the background) -->
  <g opacity="0.45">
    <circle class="orb-1" cx="220" cy="110" r="160" fill="#0284c7" filter="url(#glow)" />
    <circle class="orb-2" cx="980" cy="240" r="180" fill="#7c3aed" filter="url(#glow)" />
    <circle cx="600" cy="30" r="120" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />
  </g>

  <!-- Tech Grid Background -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Dynamic Data Stream / Flow Path (Behind foreground text) -->
  <path class="stream-line" d="M 80,180 C 260,110 380,260 600,180 C 820,100 960,240 1120,180" fill="none" stroke="url(#flowLineGrad)" stroke-width="2.5" />
  <path class="stream-line" d="M 80,210 C 300,280 440,110 600,210 C 760,310 920,110 1120,210" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Dynamic Badges / Floating Micro-Pills (Framed at the top & bottom) -->
  <g class="pill-1">
    <rect x="500" y="44" width="200" height="28" rx="14" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="516" cy="58" r="4" fill="#38bdf8" />
    <text x="528" y="63" fill="#e0f2fe" font-size="12" font-weight="600" letter-spacing="0.8">ENTERPRISE READY</text>
  </g>

  <!-- FOREGROUND: High Contrast Typography (Never obstructed) -->
  <g text-anchor="middle">
    <!-- Category Super-Title -->
    <text x="600" y="128" fill="#94a3b8" font-size="14" font-weight="700" letter-spacing="3.5">
      SECURE &#x2022; GOVERNED &#x2022; FEDERATED &#x2022; ZERO-COPY
    </text>

    <!-- Main Title -->
    <text x="600" y="178" fill="url(#titleGrad)" font-size="38" font-weight="800" letter-spacing="-0.5">
      Enterprise Private Data Exchange
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="600" y="214" fill="#cbd5e1" font-size="16" font-weight="400" letter-spacing="0.2">
      Curated Architecture, Commercial SaaS Platforms &amp; Open-Source Data Spaces
    </text>
  </g>

  <!-- Interactive Ecosystem Pill Carousel / Highlights at the Bottom -->
  <g transform="translate(140, 265)">
    <!-- Pill 1: Multi-Cloud SaaS -->
    <g class="pill-1">
      <rect x="0" y="0" width="280" height="42" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="26" fill="#38bdf8" font-size="15">&#x2601;&#xFE0F;</text>
      <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Commercial SaaS Platforms</text>
      <text x="212" y="25" fill="#64748b" font-size="11">AWS &#x2022; SNOW &#x2022; DATA</text>
    </g>

    <!-- Pill 2: Open Standards -->
    <g class="pill-2">
      <rect x="320" y="0" width="280" height="42" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1.2" />
      <text x="338" y="26" fill="#a5b4fc" font-size="15">&#x1F513;</text>
      <text x="364" y="26" fill="#f8fafc" font-size="13" font-weight="600">Open Data Spaces</text>
      <text x="480" y="25" fill="#818cf8" font-size="11">Delta Sharing &#x2022; EDC</text>
    </g>

    <!-- Pill 3: Sovereign & Mesh -->
    <g class="pill-3">
      <rect x="640" y="0" width="280" height="42" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" />
      <text x="658" y="26" fill="#34d399" font-size="15">&#x1F6E1;&#xFE0F;</text>
      <text x="684" y="26" fill="#f8fafc" font-size="13" font-weight="600">Sovereign &amp; Zero-Trust</text>
      <text x="836" y="25" fill="#64748b" font-size="11">X-Road &#x2022; Gaia-X</text>
    </g>
  </g>
</svg>
